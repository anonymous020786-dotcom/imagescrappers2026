# Website for Image Scraper Pro: the Next.js app in web/, exported as static files to web/out.
# Connect this repository in Netlify ("Add new site" → "Import an existing project"); these settings are picked up
# automatically. The Content-Security-Policy is generated per build in web/out/_headers (see
# web/scripts/security-headers.mjs), so it can list the exact inline scripts Next.js adds.
[build]
  command = "npm --prefix web ci && npm --prefix web run build"
  publish = "web/out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301
